default_provider: openai

providers:
  openai:
    type: openai
    model: gpt-4.1
    temperature: 0.0
    max_tokens: 2000

  gemini:
    type: google
    model: gemini-2.5-pro
    temperature: 0.0
    max_tokens: 2000

  anthropic:
    type: anthropic
    model: claude-haiku-4-5-20251001
    temperature: 0.0
    max_tokens: 2000

memory:
  max_recent_messages: 12
  enable_summary: true

mcp:
  url: http://127.0.0.1:8087/mcp/